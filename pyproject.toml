[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memblock"
version = "0.4.0"
description = "Typed block tree + knowledge graph memory SDK for AI agents"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "iexcalibur", email = "shubhamkannojia10@gmail.com"},
]
keywords = ["ai", "memory", "knowledge-graph", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/memblock/memblock"
Repository = "https://github.com/memblock/memblock"
"Bug Tracker" = "https://github.com/memblock/memblock/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
tokens = ["tiktoken>=0.5"]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
]
embeddings = ["fastembed>=0.3"]
embeddings-openai = ["httpx>=0.24"]
embeddings-gemini = ["httpx>=0.24"]
reranker-cohere = ["httpx>=0.24"]
reranker-cross-encoder = ["sentence-transformers>=2.0"]
all = [
    "memblock[postgres]",
    "memblock[tokens]",
    "memblock[llm]",
    "memblock[embeddings]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
memblock = "memblock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
